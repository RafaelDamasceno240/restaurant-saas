<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020001" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #020001;
        color: #f6e7cf;
        font-family: Aptos, 'Segoe UI', Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 20px 0 8px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 12px;
        color: #b89a6f;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 22px;
        border-radius: 8px;
        background: #9f6118;
        color: #f6e7cf;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>Não foi possível falar com o servidor. Confira o Wi-Fi ou os dados móveis deste aparelho.</p>
      <p>
        Vendas, pedidos e recebimentos só valem depois que o sistema confirmar. Se ficou em dúvida sobre a última
        operação, confira em Pedidos quando a conexão voltar antes de repetir.
      </p>
      <a href="/dashboard">Tentar novamente</a>
    </main>
  </body>
</html>
